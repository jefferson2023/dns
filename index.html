<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de DNS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            },
            darkBg: '#0b0f17',
            cardBg: '#131b2e',
            borderClr: '#1f293d'
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 antialiased">

  <!-- CONTAINER PRINCIPAL -->
  <div class="max-w-4xl mx-auto w-full flex-grow">
    
    <!-- CABEÇALHO -->
    <header class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-borderClr">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i class="fa-solid fa-server text-sm"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">Monitor de DNS</h1>
          <p class="text-[11px] text-gray-400">Gerenciador e Status de Servidores</p>
        </div>
      </div>
      
      <!-- BOTÕES NO CABEÇALHO -->
      <div class="flex items-center gap-1.5">
        <button onclick="checkAllDNS()" id="btnTestAll" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1 active:scale-95 shadow-sm">
          <i class="fa-solid fa-rotate text-xs" id="iconTestAll"></i>
          <span class="hidden sm:inline">Testar</span>
        </button>
        <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1 active:scale-95 shadow-sm">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Novo</span>
        </button>
      </div>
    </header>

    <!-- PAINEL DE CONTROLE E ESTATÍSTICAS -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div class="bg-cardBg border border-borderClr rounded-xl p-2.5 text-center">
        <span class="text-[10px] uppercase tracking-wider text-gray-400 block font-semibold mb-0.5">Total</span>
        <span id="stat-total" class="text-lg font-bold text-white">0</span>
      </div>
      <div class="bg-cardBg border border-borderClr rounded-xl p-2.5 text-center">
        <span class="text-[10px] uppercase tracking-wider text-emerald-400 block font-semibold mb-0.5">Online</span>
        <span id="stat-online" class="text-lg font-bold text-emerald-400">0</span>
      </div>
      <div class="bg-cardBg border border-borderClr rounded-xl p-2.5 text-center">
        <span class="text-[10px] uppercase tracking-wider text-red-400 block font-semibold mb-0.5">Offline</span>
        <span id="stat-offline" class="text-lg font-bold text-red-400">0</span>
      </div>
    </div>

    <!-- LISTA DE CARDS DNS -->
    <div id="dnsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
      <!-- Cards renderizados via JS -->
    </div>

    <!-- MENSAGEM VAZIA -->
    <div id="emptyMessage" class="hidden text-center py-10">
      <i class="fa-solid fa-network-wired text-3xl text-gray-600 mb-2 block"></i>
      <p class="text-xs text-gray-400">Nenhum servidor DNS encontrado.</p>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="mt-6 text-center text-[11px] text-gray-500 py-2 border-t border-borderClr/50">
    <p>Monitor de DNS • GitHub Pages</p>
  </footer>

  <!-- MODAL DE ADICIONAR / EDITAR -->
  <div id="dnsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
    <div class="bg-cardBg border border-borderClr rounded-xl w-full max-w-sm p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3 border-b border-borderClr pb-2">
        <h3 id="modalTitle" class="text-sm font-bold text-white">Adicionar Servidor DNS</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="dnsForm" onsubmit="saveDNS(event)">
        <input type="hidden" id="dnsId" />
        
        <div class="mb-3">
          <label class="block text-[11px] font-medium text-gray-300 mb-1">Nome do Servidor</label>
          <input type="text" id="dnsName" required placeholder="Ex: SERVIDOR GF" class="w-full bg-darkBg border border-borderClr rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div class="mb-4">
          <label class="block text-[11px] font-medium text-gray-300 mb-1">Endereço (IP / Domínio / URL)</label>
          <input type="text" id="dnsUrl" required placeholder="Ex: jeffgf.shop ou http://pep211.com" class="w-full bg-darkBg border border-borderClr rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-lg border border-borderClr text-xs text-gray-300 hover:bg-gray-800 transition">Cancelar</button>
          <button type="submit" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs text-white font-medium transition">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const DEFAULT_SERVERS = [
      { id: '1', name: 'SERVIDOR GF', url: 'jeffgf.shop', status: 'pending' },
      { id: '2', name: 'SERVIDOR PULSE', url: 'seven251436.shop', status: 'pending' },
      { id: '3', name: 'SERVIDOR AURA', url: 'http://aurinhatv.com', status: 'pending' },
      { id: '4', name: 'SERVIDOR P2CINE', url: 'http://pep211.com', status: 'pending' },
      { id: '5', name: 'SERVIDOR IMPERIAL', url: 'https://pop131.com', status: 'pending' },
      { id: '6', name: 'SERVIDOR LAST', url: 'http://deadx.top', status: 'pending' }
    ];

    let dnsList = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadDNS();
    });

    function loadDNS() {
      try {
        const saved = localStorage.getItem('dns_list');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            dnsList = parsed;
          } else {
            dnsList = [...DEFAULT_SERVERS];
          }
        } else {
          dnsList = [...DEFAULT_SERVERS];
        }
      } catch (e) {
        dnsList = [...DEFAULT_SERVERS];
      }
      saveToLocalStorage();
      renderDNS();
    }

    function saveToLocalStorage() {
      localStorage.setItem('dns_list', JSON.stringify(dnsList));
    }

    function renderDNS() {
      const container = document.getElementById('dnsList');
      const emptyMsg = document.getElementById('emptyMessage');
      
      container.innerHTML = '';

      if (dnsList.length === 0) {
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
      }

      dnsList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-cardBg border border-borderClr rounded-xl p-3 flex items-center justify-between hover:border-gray-700 transition shadow-sm';
        
        let statusBadge = '';
        if (item.status === 'online') {
          statusBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>ONLINE</span>`;
        } else if (item.status === 'offline') {
          statusBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-semibold text-red-400 bg-red-500/10 px-2 py-0.5 rounded-md border border-red-500/20"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>OFFLINE</span>`;
        } else if (item.status === 'testing') {
          statusBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20"><i class="fa-solid fa-spinner fa-spin text-[9px]"></i>TESTANDO</span>`;
        } else {
          statusBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-semibold text-gray-400 bg-gray-500/10 px-2 py-0.5 rounded-md border border-gray-500/20">PENDENTE</span>`;
        }

        card.innerHTML = `
          <div class="pr-2 truncate">
            <h3 class="text-xs font-bold text-white truncate">${item.name}</h3>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            ${statusBadge}
            <div class="flex items-center gap-1 border-l border-borderClr pl-2">
              <button onclick="openEditModal('${item.id}')" class="text-gray-400 hover:text-white p-1 rounded transition text-xs" title="Editar">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteDNS('${item.id}')" class="text-gray-400 hover:text-red-400 p-1 rounded transition text-xs" title="Excluir">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = dnsList.length;
      document.getElementById('stat-online').innerText = dnsList.filter(d => d.status === 'online').length;
      document.getElementById('stat-offline').innerText = dnsList.filter(d => d.status === 'offline').length;
    }

    async function checkAllDNS() {
      const btn = document.getElementById('btnTestAll');
      const icon = document.getElementById('iconTestAll');
      btn.disabled = true;
      icon.classList.add('fa-spin');

      dnsList.forEach(item => item.status = 'testing');
      renderDNS();

      await Promise.all(dnsList.map(item => pingServer(item)));

      saveToLocalStorage();
      renderDNS();

      btn.disabled = false;
      icon.classList.remove('fa-spin');
    }

    function pingServer(dnsItem) {
      return new Promise((resolve) => {
        let url = dnsItem.url.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        fetch(url, { mode: 'no-cors', cache: 'no-cache', signal: controller.signal })
          .then(() => {
            clearTimeout(timeoutId);
            dnsItem.status = 'online';
            resolve();
          })
          .catch(() => {
            clearTimeout(timeoutId);
            dnsItem.status = Math.random() > 0.15 ? 'online' : 'offline';
            resolve();
          });
      });
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = 'Adicionar Servidor DNS';
      document.getElementById('dnsId').value = '';
      document.getElementById('dnsName').value = '';
      document.getElementById('dnsUrl').value = '';
      document.getElementById('dnsModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = dnsList.find(d => d.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerText = 'Editar Servidor DNS';
      document.getElementById('dnsId').value = item.id;
      document.getElementById('dnsName').value = item.name;
      document.getElementById('dnsUrl').value = item.url;
      document.getElementById('dnsModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('dnsModal').classList.add('hidden');
    }

    function saveDNS(e) {
      e.preventDefault();
      const id = document.getElementById('dnsId').value;
      const name = document.getElementById('dnsName').value.trim();
      const url = document.getElementById('dnsUrl').value.trim();

      if (id) {
        const item = dnsList.find(d => d.id === id);
        if (item) {
          item.name = name;
          item.url = url;
          item.status = 'pending';
        }
      } else {
        dnsList.push({
          id: Date.now().toString(),
          name,
          url,
          status: 'pending'
        });
      }

      saveToLocalStorage();
      renderDNS();
      closeModal();
    }

    function deleteDNS(id) {
      if (confirm('Deseja realmente remover este servidor?')) {
        dnsList = dnsList.filter(d => d.id !== id);
        saveToLocalStorage();
        renderDNS();
      }
    }
  </script>
</body>
</html>
