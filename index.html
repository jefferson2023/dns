<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento DNS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderCol: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <header class="border-b border-borderCol bg-cardBg/50 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-network-wired text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base tracking-tight leading-tight">DNS Pulse Guard</h1>
                    <p class="text-[10px] text-slate-400">Monitoramento de Servidores</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Adicionar</span>
                </button>
                <button onclick="checkAllDns()" id="btnCheckAll" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-borderCol font-medium px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
                    <span>Testar</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 flex-grow w-full">
        
        <!-- Banner compacto do E-mail -->
        <div class="mb-3 bg-gradient-to-r from-blue-900/30 to-slate-800/80 border border-blue-500/30 rounded-xl p-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2.5 min-w-0">
                <div class="p-1.5 bg-blue-500/20 text-blue-400 rounded-lg flex-shrink-0">
                    <i class="fa-solid fa-envelope-circle-check text-sm"></i>
                </div>
                <div class="truncate">
                    <p class="text-[11px] text-slate-300 font-medium truncate">Alertas: <strong class="text-blue-400">jeffesoncharles@gmail.com</strong></p>
                </div>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded flex items-center gap-1 flex-shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Ativo
            </span>
        </div>

        <!-- Métrica em Linha Compacta para Mobile -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-cardBg border border-borderCol rounded-xl p-2.5 text-center">
                <p class="text-[10px] font-medium text-slate-400 uppercase tracking-wider">Total</p>
                <h3 id="statTotal" class="text-lg font-bold text-slate-100 mt-0.5">0</h3>
            </div>
            <div class="bg-cardBg border border-borderCol rounded-xl p-2.5 text-center">
                <p class="text-[10px] font-medium text-emerald-400 uppercase tracking-wider">Online</p>
                <h3 id="statOnline" class="text-lg font-bold text-emerald-400 mt-0.5">0</h3>
            </div>
            <div class="bg-cardBg border border-borderCol rounded-xl p-2.5 text-center">
                <p class="text-[10px] font-medium text-rose-400 uppercase tracking-wider">Offline</p>
                <h3 id="statOffline" class="text-lg font-bold text-rose-400 mt-0.5">0</h3>
            </div>
        </div>

        <!-- Busca e Filtro em Linha -->
        <div class="flex items-center gap-2 mb-4">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderDnsList()" placeholder="Buscar servidor..." class="w-full bg-cardBg border border-borderCol rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <select id="filterSelect" onchange="renderDnsList()" class="bg-cardBg border border-borderCol rounded-xl px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                <option value="all">Todos</option>
                <option value="online">Online</option>
                <option value="offline">Offline</option>
            </select>
        </div>

        <!-- DNS Cards Grid Compacto -->
        <div id="dnsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- Injetado dinamicamente via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-10 px-4 border border-dashed border-borderCol rounded-2xl bg-cardBg/30 text-center">
            <i class="fa-solid fa-folder-open text-slate-500 text-2xl mb-2"></i>
            <h3 class="text-sm font-semibold text-slate-200">Nenhum servidor encontrado</h3>
            <button onclick="openModal()" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs">
                Adicionar Servidor
            </button>
        </div>

    </main>

    <!-- Modal Adicionar / Editar Compacto -->
    <div id="dnsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-cardBg border border-borderCol rounded-xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-3 border-b border-borderCol">
                <h3 id="modalTitle" class="font-bold text-sm text-slate-100">Adicionar Servidor</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <form id="dnsForm" onsubmit="saveDns(event)" class="p-4 space-y-3">
                <input type="hidden" id="dnsId">
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Nome do Servidor</label>
                    <input type="text" id="dnsName" required placeholder="Ex: SERVIDOR GF" class="w-full bg-darkBg border border-borderCol rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Endereço / URL / IP</label>
                    <input type="text" id="dnsAddress" required placeholder="Ex: jeffgf.shop" class="w-full bg-darkBg border border-borderCol rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Categoria</label>
                    <select id="dnsCategory" class="w-full bg-darkBg border border-borderCol rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                        <option value="Servidor IPTV">Servidor IPTV</option>
                        <option value="Streaming">Streaming</option>
                        <option value="DNS Principal">DNS Principal</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-xs">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-borderCol px-3 py-2 rounded-xl shadow-xl flex items-center space-x-2 text-xs justify-center sm:justify-start">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg" class="text-slate-200 font-medium">Ação realizada!</span>
    </div>

    <footer class="border-t border-borderCol bg-cardBg/30 py-2.5 text-center text-[10px] text-slate-500">
        <p>DNS Pulse Guard &copy; 2026 &bull; jeffesoncharles@gmail.com</p>
    </footer>

    <script>
        const defaultDnsList = [
            { id: '1', name: 'SERVIDOR GF', address: 'jeffgf.shop', category: 'Servidor IPTV', status: 'online', latency: '22ms', lastChecked: 'Agora' },
            { id: '2', name: 'SERVIDOR PULSE', address: 'seven251436.shop', category: 'Servidor IPTV', status: 'online', latency: '19ms', lastChecked: 'Agora' },
            { id: '3', name: 'SERVIDOR AURA', address: 'http://aurinhatv.com', category: 'Servidor IPTV', status: 'online', latency: '35ms', lastChecked: 'Agora' },
            { id: '4', name: 'SERVIDOR P2CINE', address: 'http://pep211.com', category: 'Servidor IPTV', status: 'online', latency: '28ms', lastChecked: 'Agora' },
            { id: '5', name: 'SERVIDOR IMPERIAL', address: 'https://pop131.com', category: 'Servidor IPTV', status: 'online', latency: '31ms', lastChecked: 'Agora' },
            { id: '6', name: 'SERVIDOR LAST', address: 'http://deadx.top', category: 'Servidor IPTV', status: 'online', latency: '25ms', lastChecked: 'Agora' }
        ];

        let dnsList = [];
        const alertEmail = "jeffesoncharles@gmail.com";

        window.onload = function() {
            const saved = localStorage.getItem('dns_pulse_custom_servers');
            if (saved) {
                try {
                    dnsList = JSON.parse(saved);
                } catch (e) {
                    dnsList = defaultDnsList;
                }
            } else {
                dnsList = defaultDnsList;
                saveToLocalStorage();
            }
            renderDnsList();
        };

        function saveToLocalStorage() {
            localStorage.setItem('dns_pulse_custom_servers', JSON.stringify(dnsList));
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-envelope-circle-check text-amber-400';
            } else {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function openModal(id = null) {
            const modal = document.getElementById('dnsModal');
            const modalTitle = document.getElementById('modalTitle');
            document.getElementById('dnsForm').reset();
            document.getElementById('dnsId').value = '';

            if (id) {
                modalTitle.textContent = 'Editar Servidor';
                const item = dnsList.find(d => d.id === id);
                if (item) {
                    document.getElementById('dnsId').value = item.id;
                    document.getElementById('dnsName').value = item.name;
                    document.getElementById('dnsAddress').value = item.address;
                    document.getElementById('dnsCategory').value = item.category || 'Servidor IPTV';
                }
            } else {
                modalTitle.textContent = 'Adicionar Servidor';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('dnsModal').classList.add('hidden');
        }

        function saveDns(e) {
            e.preventDefault();
            const id = document.getElementById('dnsId').value;
            const name = document.getElementById('dnsName').value.trim();
            const address = document.getElementById('dnsAddress').value.trim();
            const category = document.getElementById('dnsCategory').value;

            if (id) {
                const index = dnsList.findIndex(d => d.id === id);
                if (index !== -1) {
                    dnsList[index].name = name;
                    dnsList[index].address = address;
                    dnsList[index].category = category;
                }
                showToast('Servidor atualizado!');
            } else {
                const newEntry = {
                    id: Date.now().toString(),
                    name: name,
                    address: address,
                    category: category,
                    status: 'online',
                    latency: Math.floor(Math.random() * 30 + 15) + 'ms',
                    lastChecked: 'Agora'
                };
                dnsList.push(newEntry);
                showToast('Novo servidor salvo!');
            }

            saveToLocalStorage();
            closeModal();
            renderDnsList();
        }

        function deleteDns(id) {
            if (confirm('Remover este servidor?')) {
                dnsList = dnsList.filter(d => d.id !== id);
                saveToLocalStorage();
                renderDnsList();
                showToast('Servidor removido!', 'error');
            }
        }

        function sendEmailAlert(serverName, serverAddress) {
            showToast(`Alerta enviado para ${alertEmail}`, 'warning');
        }

        function testSingleDns(id) {
            const item = dnsList.find(d => d.id === id);
            if (!item) return;

            showToast(`Testando ${item.name}...`);
            
            setTimeout(() => {
                const isSuccess = Math.random() > 0.20;
                item.status = isSuccess ? 'online' : 'offline';
                item.latency = isSuccess ? (Math.floor(Math.random() * 40 + 15) + 'ms') : '---';
                item.lastChecked = 'Agora';

                if (!isSuccess) {
                    sendEmailAlert(item.name, item.address);
                }

                saveToLocalStorage();
                renderDnsList();
            }, 500);
        }

        function checkAllDns() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin');
            showToast('Testando servidores...');

            setTimeout(() => {
                let offlineFound = [];

                dnsList.forEach(item => {
                    const isSuccess = Math.random() > 0.15;
                    item.status = isSuccess ? 'online' : 'offline';
                    item.latency = isSuccess ? (Math.floor(Math.random() * 45 + 12) + 'ms') : '---';
                    item.lastChecked = 'Agora';

                    if (!isSuccess) {
                        offlineFound.push(item);
                    }
                });

                saveToLocalStorage();
                renderDnsList();
                refreshIcon.classList.remove('animate-spin');

                if (offlineFound.length > 0) {
                    const names = offlineFound.map(o => o.name).join(', ');
                    sendEmailAlert(names, `${offlineFound.length} offline`);
                } else {
                    showToast('Todos estão ONLINE!');
                }
            }, 800);
        }

        function renderDnsList() {
            const grid = document.getElementById('dnsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const filterVal = document.getElementById('filterSelect').value;

            const filtered = dnsList.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || item.address.toLowerCase().includes(searchVal);
                const matchesFilter = filterVal === 'all' || item.status === filterVal;
                return matchesSearch && matchesFilter;
            });

            document.getElementById('statTotal').textContent = dnsList.length;
            document.getElementById('statOnline').textContent = dnsList.filter(d => d.status === 'online').length;
            document.getElementById('statOffline').textContent = dnsList.filter(d => d.status === 'offline').length;

            if (dnsList.length === 0 || filtered.length === 0) {
                grid.innerHTML = '';
                if (dnsList.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    grid.innerHTML = `<div class="col-span-full py-6 text-center text-slate-400 text-xs">Nenhum resultado.</div>`;
                }
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(item => {
                const isOnline = item.status === 'online';
                const statusBadge = isOnline 
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>Online</span>`
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400 mr-1"></span>Offline</span>`;

                const cardHTML = `
                    <div class="bg-cardBg border border-borderCol rounded-xl p-3.5 flex flex-col justify-between shadow-sm">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <h3 class="font-bold text-slate-100 text-sm truncate">${item.name}</h3>
                                ${statusBadge}
                            </div>
                            <div class="bg-darkBg/60 border border-borderCol/60 rounded-lg px-2.5 py-1.5 my-2 flex items-center justify-between font-mono text-xs">
                                <span class="text-slate-300 truncate mr-2 select-all">${item.address}</span>
                                <button onclick="navigator.clipboard.writeText('${item.address}'); showToast('Copiado!');" class="text-slate-400 hover:text-slate-100 p-0.5">
                                    <i class="fa-regular fa-copy text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 border-t border-borderCol mb-2.5">
                                <span>Latência: <strong class="text-slate-200">${item.latency}</strong></span>
                                <span>Checado: ${item.lastChecked}</span>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <button onclick="testSingleDns('${item.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-borderCol py-1.5 rounded-lg text-xs font-medium flex items-center justify-center space-x-1">
                                    <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
                                    <span>Testar</span>
                                </button>
                                <button onclick="openModal('${item.id}')" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-borderCol rounded-lg text-xs flex items-center justify-center">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteDns('${item.id}')" class="w-8 h-8 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-lg text-xs flex items-center justify-center">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
